[workspace]
members = ["crates/core", "crates/lv2-host", "crates/engine", "crates/gui", "crates/lv2-ui-host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[package]
name = "live-keys"
version.workspace = true
edition.workspace = true

[dependencies]
live-keys-engine = { path = "crates/engine" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
