[workspace]
members = ["crates/core", "crates/lv2-host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[package]
name = "live-keys"
version.workspace = true
edition.workspace = true

[dependencies]
live-keys-core = { path = "crates/core" }
live-keys-lv2-host = { path = "crates/lv2-host" }
cpal = "0.18"
midir = "0.11"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
