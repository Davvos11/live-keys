[package]
name = "live-keys-gui"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "live-keys-gui"
path = "src/main.rs"

[dependencies]
live-keys-engine = { path = "../engine" }
live-keys-lv2-ui = { path = "../lv2-ui-host" }
slint = "1.17"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[build-dependencies]
slint-build = "1.17"
