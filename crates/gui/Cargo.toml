[package]
name = "live-keys-gui"
version.workspace = true
description = "Plugin host (LV2, VST3 and CLAP) for playing a MIDI keyboard live"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "live-keys-gui"
path = "src/main.rs"

[dependencies]
live-keys-engine = { path = "../engine" }
live-keys-lv2-ui = { path = "../lv2-ui-host" }
live-keys-vst3-ui = { path = "../vst3-ui-host" }
live-keys-clap-ui = { path = "../clap-ui-host" }
slint = "1.18"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"

[build-dependencies]
slint-build = "1.18"

# The `.deb` built by the release workflow (`cargo deb -p live-keys-gui --no-build`): both
# binaries, from the build the workflow already made. Its version comes from the release tag.
[package.metadata.deb]
name = "live-keys"
maintainer = "David Vos <vosdavid2@gmail.com>"
copyright = "David Vos"
license-file = ["../../LICENSE", "0"]
section = "sound"
priority = "optional"
depends = "$auto"
extended-description = """\
An instrument rack for playing live from a MIDI keyboard: LV2 and VST3 instruments and \
effects in a few parallel slots, each with its own keyboard zone, presets and scenes. \
Contains the app (live-keys-gui) and a headless command-line host (live-keys)."""
assets = [
    ["target/release/live-keys-gui", "usr/bin/", "755"],
    ["target/release/live-keys", "usr/bin/", "755"],
    ["live-keys.desktop", "usr/share/applications/", "644"],
    ["../../README.md", "usr/share/doc/live-keys/", "644"],
    # Licences of the assets compiled into live-keys-gui.
    ["ui/assets/fonts/OFL.txt", "usr/share/doc/live-keys/SourceSans3-OFL.txt", "644"],
    ["ui/assets/icons/LICENSE", "usr/share/doc/live-keys/Lucide-LICENSE.txt", "644"],
    ["ui/assets/photos/CREDITS.md", "usr/share/doc/live-keys/photo-credits.md", "644"],
]
