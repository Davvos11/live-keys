# cargo deny --workspace check — run after adding or updating a dependency (see
# CLAUDE.md). Without --workspace it only checks the CLI's dependencies.

[graph]
all-features = true

[licenses]
# Live Keys is MIT: only licences that allow that, without asking us to
# relicense or publish our code. A dependency under anything else fails the
# check; decide case by case before adding it here or as an exception.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # File-level copyleft: only changes to the dependency's own files would
    # have to be published.
    "MPL-2.0",
]
confidence-threshold = 0.9
exceptions = [
    # Slint is GPL-3.0, royalty-free or commercial; we use it under the
    # royalty-free licence, which requires the "Made with Slint" attribution
    # (AboutSlint on the Settings tab). A new Slint crate needs adding here.
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "slint" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "slint-build" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "slint-macros" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-backend-selector" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-backend-winit" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-common" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-compiler" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-core" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-core-macros" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-renderer-femtovg" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-renderer-skia" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-renderer-software" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "warn"
# Unmaintained crates only fail the check when we depend on them directly: deep
# in another crate's tree (Slint's) we couldn't replace them anyway.
unmaintained = "workspace"
